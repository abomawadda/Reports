<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--p:#5b2a86;--p2:#7b4aa8;--pl:#efe7f6;--ink:#1d1b24;--mut:#6b6778;--bg:#f3f0f8;--ok:#1e8e5a;--bad:#c0392b;--warn:#d98a00;--line:#d9d2e3}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:14px}
.top{background:linear-gradient(90deg,#3d1a5c,var(--p) 60%,#8a4fc0);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:17px;margin:0;font-weight:800;flex:1;min-width:200px}
.chip{background:#ffffff26;border:1px solid #ffffff44;color:#fff;border-radius:20px;padding:4px 12px;font-size:12.5px;cursor:default}
.chip.ok{background:#1e8e5a55}.chip.err{background:#c0392b88}.chip.act{cursor:pointer}
.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
aside{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 6px #0001;align-self:start}
.ml{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.mi{padding:9px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mi small{color:var(--mut)}
.mi.on{background:var(--pl);border-color:var(--p2);font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink);font-weight:600}
.btn:hover{background:var(--pl)}
.btn.pri{background:var(--p);color:#fff;border-color:var(--p)}.btn.pri:hover{background:var(--p2)}
.btn.bad{color:var(--bad)}.btn.sm{padding:3px 10px;font-size:12.5px}.btn.wide{width:100%}
.hdr{background:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 1px 6px #0001}
.hdr h2{margin:0;color:var(--p);font-size:22px}.hdr small{color:var(--mut)}
.hdr label{display:flex;align-items:center;gap:8px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:0;background:#fff;padding:9px 15px;border-radius:22px;cursor:pointer;font-weight:700;color:var(--mut);box-shadow:0 1px 4px #0001}
.tabs button.on{background:var(--p);color:#fff}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 6px #0001}
.card h3{margin:0 0 12px;font-size:16px;color:var(--p);display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600}
.fld span{font-size:13px;color:var(--mut)}.fld em{color:var(--bad);font-style:normal;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=url],input[type=password],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:var(--p2)}
input.calc{background:#f7f4fb;color:var(--p)}input.calc.ov{background:#fff4d6;border-color:var(--warn)}
.cf input{border-color:var(--c);border-width:2px;font-size:16px;font-weight:700}
.total{margin-top:14px;background:var(--pl);border-radius:12px;padding:12px 16px}
.total b{font-size:22px;color:var(--p);margin-right:10px}.words{color:var(--mut);margin-top:4px}
.tw{overflow-x:auto}
.et{border-collapse:collapse;width:100%;min-width:560px}
.et th{background:var(--pl);color:var(--p);padding:7px 8px;font-size:13px;border:1px solid var(--line);white-space:nowrap}
.et td{padding:4px;border:1px solid var(--line);text-align:center}
.et td input{text-align:center;min-width:70px;padding:6px}
.et td output{font-weight:800;color:var(--p)}
.et th.rl{background:#faf8fc;text-align:right}
.vo{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.vo .vl{font-weight:600}
.mut{color:var(--mut)}.ok{color:var(--ok);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 6px #0001;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--p2)}
.kpi i{font-style:normal;font-size:22px}.kpi span{color:var(--mut);font-size:12.5px}.kpi b{font-size:20px;color:var(--p)}
.warn{padding:8px 12px;border-radius:9px;margin-bottom:6px;font-weight:600}
.warn.warn{background:#fff4d6}.warn.bad{background:#fde3e0}.warn.info{background:#e7f3fb}
.bars{display:flex;gap:10px;align-items:flex-end;height:200px;overflow-x:auto;padding-bottom:4px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:60px;flex:1;height:100%;font-size:11.5px}
.bar i{display:block;width:60%;background:linear-gradient(var(--p2),var(--p));border-radius:6px 6px 0 0}
.sel{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:10px}.chk{display:flex;gap:6px;align-items:center;font-weight:600}
.chk input{width:auto}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;align-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.mbox{background:#fff;border-radius:16px;max-width:860px;width:100%;padding:18px 20px;box-shadow:0 10px 40px #0005}
.mbox h2{margin:0 0 12px;color:var(--p)}.mbox h4{margin:18px 0 8px;color:var(--p);border-bottom:2px solid var(--pl);padding-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mbox textarea.code{direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12px;height:190px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:24px;z-index:99;font-weight:600}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:6px 0 30px}
.ri{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;background:#fff}
.ori{border:1px solid var(--line);background:#faf8fc;color:var(--mut);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.ori.on{background:var(--p);border-color:var(--p);color:#fff}
details summary{cursor:pointer;font-weight:700;color:var(--p)}
ol.st{line-height:1.9;padding-right:20px}
</style>
<style id="sheetcss">
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
body,button,input,select,textarea,.sheet,.sheet *{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif!important}
.sheet .two.se>tbody>tr>td:first-child{width:32%}
.sheet .two.se>tbody>tr>td:last-child{width:68%}
.sheet .two.se .t th,.sheet .two.se .t td,.sheet .two.se .t th.rl{white-space:nowrap;padding-inline:5px}
.sheet{position:relative;background:#fff;width:210mm;min-height:296mm;padding:11mm 13mm 16mm;box-shadow:0 2px 14px #0003;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;font-size:11pt;line-height:1.5;color:#1d1b24;direction:rtl;text-align:right;page-break-after:always;break-after:page;overflow:hidden}
.sheet::before{content:'';position:absolute;top:0;right:0;left:0;height:4mm;background:linear-gradient(90deg,#3d1a5c,#5b2a86 55%,#8a4fc0)}
.sheet.land{width:297mm;min-height:208mm;padding:9mm 10mm 14mm;font-size:9pt;page:land}
.sheet table{border-collapse:collapse;width:100%}
.sheet .lh{margin:1mm 0 6px;border-bottom:2px solid #5b2a86}
.sheet .lh td{vertical-align:middle;padding:0 0 5px}
.sheet .lh .lg{width:74px}.sheet .lh .lg img{max-height:62px;max-width:68px}
.sheet .org{font-size:16pt;font-weight:800;color:#5b2a86;line-height:1.25}
.sheet .sub{font-size:9.5pt;color:#5d5868;line-height:1.45}
.sheet .lh .dt{text-align:left;white-space:nowrap;width:180px}
.sheet .meta{display:inline-block;border:1px solid #d9d2e3;border-radius:8px;padding:4px 10px;font-size:9.5pt;line-height:1.7;text-align:right;background:#faf8fc}
.sheet .meta b{color:#3d1a5c}
.sheet .ttl{background:linear-gradient(90deg,#4a1f70,#6a3a96);color:#fff;border-radius:8px;padding:5px 16px;text-align:center;font-weight:800;font-size:12.5pt;margin:6px 0}
.sheet .nom{text-align:center;margin:4px 0 8px}
.sheet .nom span{display:inline-block;border:1.5px solid #5b2a86;color:#5b2a86;border-radius:20px;padding:0 16px;font-weight:800;font-size:10.5pt}
.sheet .subj{background:#f4eefa;border-right:5px solid #5b2a86;border-radius:6px 0 0 6px;padding:5px 12px;font-weight:700;margin:7px 0}
.sheet .subj small{color:#7b4aa8;font-weight:800;margin-left:6px}
.sheet .addr{font-weight:800;font-size:12pt;margin:8px 0 1px;color:#3d1a5c}
.sheet .greet{margin:2px 0 6px;color:#3d3a45}
.sheet .txt{text-align:justify;margin:4px 0 6px}
.sheet .close{text-align:center;margin:8px 0 2px;font-weight:600}
.sheet .t{margin:3px 0 6px;font-size:10pt;line-height:1.4}
.sheet .t thead{display:table-header-group}
.sheet .t.cp{font-size:9pt;line-height:1.25}.sheet .t.cp td,.sheet .t.cp th{padding:1.5px 5px}
.sheet .t tr{break-inside:avoid;page-break-inside:avoid}
.sheet .t th{background:#5b2a86;color:#fff;padding:4px 5px;border:1px solid #5b2a86;text-align:center;font-weight:700}
.sheet .t td{border:1px solid #ddd3e8;padding:3px 5px;text-align:center}
.sheet .t tbody tr:nth-child(even) td{background:#fbf9fd}
.sheet .t th.rl{background:#f1eaf8;color:#3d1a5c;text-align:right;border-color:#ddd3e8}
.sheet .t th.gh{background:#7b4aa8;border-color:#7b4aa8;font-size:10.5pt;text-align:right;padding-right:12px}
.sheet .t td.kl{text-align:right;font-weight:700;width:36%;background:#f8f4fc!important;color:#3d1a5c}
.sheet .t td.kv,.sheet .t td.tl{text-align:right}
.sheet .t td .sm{color:#666;font-size:9pt}
.sheet .t tr.tot td{background:#efe7f6!important;font-weight:800;color:#3d1a5c;border-top:2px solid #5b2a86}
.sheet .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .red{color:#c0392b;font-weight:700}
.tag{display:inline-block;border-radius:5px;padding:0 8px;font-size:11px;font-weight:700;background:#ece6f5;color:#5b3a8c;margin-inline-start:6px}
.sheet .tag{display:inline-block;border-radius:5px;padding:0 8px;font-size:9.5pt;font-weight:700}
.sheet .tag.u{background:#fff4d6;color:#8a5a00}.sheet .tag.n{background:#eeecf2;color:#6b6778}
.sheet .bt{color:#3d1a5c;font-weight:800;font-size:10.5pt;padding:1px 0 1px 10px;margin-top:5px;display:flex;align-items:center;gap:8px}
.sheet .bt::before{content:'';width:9px;height:9px;border-radius:2px;background:#5b2a86;flex:none}
.sheet .two{border-collapse:separate;border-spacing:8px 0;width:calc(100% + 16px);margin:0 -8px}
.sheet .two>tbody>tr>td{vertical-align:top;width:50%;padding:0}
.sheet .cards{border-collapse:separate;border-spacing:7px;margin:0 -7px;width:calc(100% + 16px)}
.sheet .cdc{width:25%;vertical-align:top}
.sheet .cd{border:1px solid #e3dcec;border-radius:10px;overflow:hidden;border-top:4px solid var(--c)}
.sheet .cdt{padding:5px 6px 0;text-align:center;font-weight:700;color:#4a4655;font-size:10pt}
.sheet .cdv{padding:0 6px 2px;text-align:center;font-weight:800;font-size:12.5pt;color:var(--c)}
.sheet .cdp{font-size:8pt;color:#7a7585;text-align:center;padding-bottom:4px}
.sheet .hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(90deg,#f4eefa,#fff);border:1px solid #e3dcec;border-radius:12px;padding:6px 16px;margin:6px 0}
.sheet .hero .hl{color:#5d5868;font-weight:700}.sheet .hero .hv{font-size:18pt;font-weight:800;color:#5b2a86;line-height:1.2}
.sheet .hero .hw{color:#5d5868;font-size:9.5pt;max-width:60%;text-align:left}
.sheet .hb{height:9px;background:#efe9f5;border-radius:5px;overflow:hidden;min-width:70px}
.sheet .hb i{display:block;height:100%;border-radius:5px}
.sheet .kg{border-collapse:separate;border-spacing:7px;margin:0 -7px;width:calc(100% + 16px)}
.sheet .kg td{border:1px solid #e3dcec;border-radius:10px;padding:5px 10px;width:33.3%;vertical-align:top;background:#fcfbfe}
.sheet .kg span{display:block;color:#6b6778;font-size:9.5pt;font-weight:600}
.sheet .kg b{display:block;font-size:13pt;line-height:1.3;color:#3d1a5c}
.sheet .kg em{font-style:normal;font-size:9pt;font-weight:700}
.sheet .up{color:#1e8e5a}.sheet .dn{color:#c0392b}.sheet .eq{color:#8a8595}
.sheet .sig{margin-top:8px}.sheet .sig td{width:50%;text-align:center;vertical-align:top;line-height:1.6;font-size:10.5pt}
.sheet .sig .ln{display:block;width:60%;margin:16px auto 2px;border-top:1px dotted #8a8595}
.sheet .note{border:1px solid #e0d6ea;border-right:4px solid #d98a00;background:#fffaf0;border-radius:6px;padding:6px 10px;font-size:10pt;margin:6px 0;text-align:justify}
.sheet .alert{border-radius:6px;padding:4px 10px;font-size:10pt;margin:3px 0;font-weight:600}
.sheet .alert.warn{background:#fff4d6}.sheet .alert.bad{background:#fde3e0}.sheet .alert.info{background:#e9f3fb}.sheet .alert.ok{background:#e4f5ec;color:#1e6b46}
.sheet .foot td{width:50%;text-align:center;font-weight:700;padding-top:10px}
.sheet .pill{display:inline-block;background:#6a3a96;color:#fff;border-radius:6px;padding:0 14px}
.sheet .pf{position:absolute;bottom:6mm;right:13mm;left:13mm;border-top:1px solid #e3dcec;padding-top:3px;display:flex;justify-content:space-between;font-size:8.5pt;color:#8a8595}
.sheet.land .pf{right:10mm;left:10mm;bottom:5mm}

/* ===== تحسينات التصميم ===== */
:root{--sh:0 1px 2px #2a1a4012,0 6px 18px #2a1a4012;--r:16px}
body{background:radial-gradient(1200px 420px at 100% -80px,#e7dbf5 0,transparent 70%),var(--bg);-webkit-text-size-adjust:100%}
.card,.hdr,aside,.kpi{box-shadow:var(--sh);border:1px solid #ece6f4;border-radius:var(--r)}
.card h3{padding-bottom:10px;border-bottom:1px solid #f0eaf7;flex-wrap:wrap}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{position:relative;overflow:hidden;border-top:0;background:linear-gradient(160deg,#fff 55%,#f6f0fb)}
.kpi:before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--p),#b07bdc)}
.kpi i{width:40px;height:40px;border-radius:12px;background:var(--pl);display:grid;place-items:center;font-size:20px}
.kpi b{font-size:22px;letter-spacing:.2px}
.dl{font-style:normal;font-size:12px;font-weight:700;color:var(--mut)}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.tabs{position:sticky;top:56px;z-index:10;background:#f3f0f8e8;backdrop-filter:blur(6px);padding:8px 0;margin:6px 0 10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;min-height:40px}
.dtwo{display:grid;grid-template-columns:minmax(260px,.8fr) 1.6fr;gap:16px;align-items:start}
.dsub{font-weight:800;color:var(--ink);margin:2px 0 8px;font-size:13.5px}
.et th.rl,.et td.rl{text-align:right}
.et tr.sumr td{background:var(--pl);font-weight:800;color:var(--p)}
.et tbody tr:nth-child(even) td{background:#fbf9fd}.et tr.sumr td{background:var(--pl)!important}
.et td.na{color:#c7c0d3;background:#f6f4f9!important}
.lv th,.lv td{padding:6px 5px;font-size:13px}
.qin{width:68px;min-width:0!important;padding:5px!important;text-align:center;border-radius:8px}.qin.cu{background:#fff4d6;border-color:var(--warn)}
.pill2{display:inline-block;min-width:38px;padding:2px 10px;border-radius:20px;font-weight:800}
.pill2.grn{background:#e4f5ec;color:#1e6b46}.pill2.amb{background:#fff1d0;color:#8a5a00}.pill2.red{background:#fde3e0;color:#a52a1d}
.meter{height:7px;background:#ece6f4;border-radius:5px;overflow:hidden;min-width:70px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#7b4aa8,#c08ae8)}
.proj{background:#eef6ff!important;color:#1a5c9a}
.bar.cur i{background:linear-gradient(#c08ae8,#5b2a86)}
.warn{border-radius:10px}
select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
@media(max-width:1100px){
 .layout{grid-template-columns:1fr;padding:10px;gap:10px}
 aside{padding:8px;position:static}
 aside .btn.wide{width:auto;float:left;margin-right:8px}
 .ml{flex-direction:row;overflow-x:auto;max-height:none;padding:4px 2px 8px;margin-top:6px;scrollbar-width:thin}
 .mi{min-width:132px;flex:0 0 auto;flex-direction:column;align-items:flex-start;gap:0}

/* ===== الهيكل المؤسسي ===== */
:root{--lta:#5b2a86;--ltc:#b86e00;--lts:#0f7c8a}
#tabs{display:none}
.top{padding:8px 16px;gap:10px}.top h1{font-size:16px}
.msw{display:flex;align-items:center;gap:4px;background:#ffffff22;border:1px solid #ffffff44;border-radius:12px;padding:3px}

.msb{background:#ffffff26;color:#fff;border:0;border-radius:9px;width:34px;height:34px;font-size:20px;cursor:pointer;line-height:1}

.layout{grid-template-columns:236px 1fr}
aside{padding:10px 8px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.ng{font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.3px;padding:12px 10px 4px}
.ng:first-child{padding-top:2px}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:0;background:transparent;padding:10px 12px;border-radius:11px;cursor:pointer;font-weight:700;color:#3a3548;font-size:14px}
.ni i{font-style:normal;width:26px;height:26px;display:grid;place-items:center;background:var(--pl);border-radius:8px;font-size:14px;flex:none}
.ni:hover{background:#f6f1fb}
.ni.on{background:var(--p);color:#fff;box-shadow:0 4px 12px #5b2a8644}.ni.on i{background:#ffffff2e}

function calcAll(m){
 const g=p=>num(getP(m,p));const c={};
 const eff=p=>{const o=getP(m,p);return (o!==undefined&&o!=='')?num(o):c[p];};
 for(const k of ['cass','crim']){const b='f1.'+k+'.';c[b+'tot']=g(b+'for')+g(b+'ag');c[b+'rem']=g(b+'under')+g(b+'in')-c[b+'tot'];}
 for(const k of ['inv','cmp','fat','con','seiz']){const b='f1.'+k+'.';c[b+'rem']=g(b+'under')+g(b+'in')-g(b+'fin');}
 c['f1.exe.rem']=g('f1.exe.under')+g('f1.exe.in')-g('f1.exe.fin');
 c['f1.exe.vrem']=g('f1.exe.vunder')+g('f1.exe.vin')-g('f1.exe.vfin');
 c['col.total']=COLS.reduce((a,x)=>NOTOT.includes(x[0])?a:a+g('col.'+x[0]),0);
 c['f1.seiz.coll']=c['col.total'];
 const L='f2.lab.';
 c[L+'lrem']=g(L+'lu')+g(L+'li')-g(L+'lf')-g(L+'la');
 c[L+'nrem']=g(L+'nu')+g(L+'ni')-g(L+'nf')-g(L+'na');
 c[L+'under']=g(L+'lu')+g(L+'nu');c[L+'circL']=g(L+'lu')+g(L+'li');c[L+'circN']=g(L+'nu')+g(L+'ni');
 c[L+'circ']=c[L+'circL']+c[L+'circN'];c[L+'for']=g(L+'lf')+g(L+'nf');c[L+'ag']=g(L+'la')+g(L+'na');c[L+'jud']=c[L+'for']+c[L+'ag'];
 c[L+'rem']=eff(L+'lrem')+eff(L+'nrem');
 for(const k of ['co','vs']){const b='f2.civ.'+k+'.';c[b+'tot']=g(b+'for')+g(b+'ag');c[b+'rem']=g(b+'under')+g(b+'in')-c[b+'tot'];}
 const T='f2.civ.t.';
 for(const x of ['under','in','for','ag'])c[T+x]=g('f2.civ.co.'+x)+g('f2.civ.vs.'+x);
 c[T+'tot']=c[T+'for']+c[T+'ag'];c[T+'rem']=eff('f2.civ.co.rem')+eff('f2.civ.vs.rem');
 c['f2.app.rem']=g('f2.app.under')+g('f2.app.in')-g('f2.app.fin');
 return c;
}
function ctx(m){const C=calcAll(m);const v=p=>{if(p in C){const o=getP(m,p);return (o!==undefined&&o!=='')?num(o):C[p];}return num(getP(m,p));};v.C=C;return v;}
function kpis(m){const v=ctx(m);return{col:v('col.total'),settle:v('f1.settle.val'),settleN:v('f1.settle.cnt'),seiz:v('f1.seiz.rem'),lab:v('f2.lab.rem'),civ:v('f2.civ.t.rem'),exe:v('f1.exe.vrem'),cass:v('f1.cass.rem'),crim:v('f1.crim.rem'),inv:v('f1.inv.rem'),cmp:v('f1.cmp.rem'),fat:v('f1.fat.rem'),con:v('f1.con.rem')};}
function voInfo(m,k,v){
 const j=(m.jud&&m.jud[k])||{};let mode=j.mode,amt=num(j.amount);
 if(k==='settle'&&!mode){const x=v('f1.settle.val');mode=x>0?'amount':'none';amt=x;}
 return {mode:mode||'none',amt};
}
function voText(m,k,v){
 const {mode,amt}=voInfo(m,k,v);
 if(mode==='hide')return null;
 if(mode==='amount')return esc(moneyWords(amt))+' <span class="sm">('+fmt(amt)+')</span>';
 return mode==='unest'?'<span class="tag u">غير مقدرة القيمة</span>':'<span class="tag n">لا يوجد</span>';
}
function warnings(m){
 const w=[];const v=ctx(m);
 if(!v('col.total'))w.push(['info','لم يتم إدخال متحصلات هذا الشهر بعد.']);
 const o=getP(m,'f1.seiz.coll');
 if(o!==undefined&&o!==''&&Math.abs(num(o)-v.C['col.total'])>0.005)w.push(['warn','المبلغ المحصل في ملفات الحجز الإداري ('+fmt(o)+') لا يطابق إجمالي المتحصلات ('+fmt(v.C['col.total'])+').']);
 Object.keys(v.C).forEach(p=>{if(PL[p]&&/rem$/.test(p)&&v(p)<0)w.push(['bad','قيمة سالبة في: '+PL[p]]);});
 const ks=monthKeys().filter(k=>k<m.key),pk=ks[ks.length-1];
 if(!pk)w.push(['info','هذا أقدم شهر مسجل فهو «شهر الأساس»: أرصدته الافتتاحية (تحت اليد) تُدخل يدوياً من التقرير الأصلي، وتُرحَّل منه الشهور اللاحقة.']);
 if(pk){
  const pv=ctx(S.months[pk]);const bad=CARRY.filter(([t,s])=>Math.abs(v(t)-pv(s))>0.005).map(([t])=>PL[t]);
  if(bad.length)w.push(['warn','الرصيد الافتتاحي (تحت اليد) لا يطابق متبقي '+periodLabel(pk)+' في: '+bad.slice(0,4).join('، ')+(bad.length>4?' …':'')]);
  if(nextKey(pk)!==m.key)w.push(['info','يوجد فاصل زمني بين هذا الشهر وآخر شهر مسجل قبله ('+periodLabel(pk)+').']);
 }
 return w;
}
function flatRows(m){
 const v=ctx(m),r=[];
 COLS.forEach(c=>r.push(['المتحصلات',c[1],v('col.'+c[0])]));r.push(['المتحصلات','الإجمالي (بدون اللاسلكي والديون المعدومة)',v('col.total')]);
 JUD.forEach(([t,its])=>its.forEach(([k,l])=>{const x=voInfo(m,k,v);r.push(['الأحكام والمصالحات',t+' – '+l,x.mode==='amount'?x.amt:x.mode==='unest'?'غير مقدرة القيمة':x.mode==='hide'?'غير مدرج':'لا يوجد']);}));
 [...F1,...F2].forEach(b=>b.rows.forEach(([l,base,ks])=>ks.forEach((sp,i)=>r.push([b.t,(l?l+' – ':'')+b.h[i],v(base+'.'+sp.split(':')[0])]))));
 (m.loy.for||[]).forEach(x=>r.push(['أحكام الولاء – للصالح',(x.no||'')+' – '+(x.plaintiff||''),x.ruling||'']));
 (m.loy.ag||[]).forEach(x=>r.push(['أحكام الولاء – للضد',(x.no||'')+' – '+(x.plaintiff||''),x.ruling||'']));
 (m.loy.pend||[]).forEach(x=>r.push(['قضايا الولاء المتداولة',(x.no||'')+' – '+(x.plaintiff||''),num(x.amount)]));
 (m.emps||[]).forEach(x=>r.push(['العاملون – أيام الأجازات',x.name||'',leaveTotal(x)]));
 return r;
}

/* ضبط كل صفحة تلقائياً: تكبير/تصغير المحتوى ثم توسيع الصفوف ثم توزيع المسافات حتى تمتلئ الصفحة دون تجاوز */
function fillPages(){
 const el=$('#pages');if(!el)return;el.style.zoom=1;
 const mmpx=x=>x*96/25.4;
 el.querySelectorAll('.sheet').forEach(sh=>{
  const sc=sh.querySelector('.sc');if(!sc)return;
  const minH=mmpx(sh.classList.contains('land')?208:296)+1;
  const set=(k,rp,g)=>{sh.style.setProperty('--k',k);sh.style.setProperty('--rp',rp+'px');sh.style.setProperty('--gap',g+'px');};
  const fits=()=>sh.offsetHeight<=minH+1&&sh.scrollWidth<=sh.clientWidth+1;
  sh.classList.add('meas');
  const search=(lo,hi,fn,it)=>{for(let i=0;i<it;i++){const mid=(lo+hi)/2;if(fn(mid))lo=mid;else hi=mid;}return lo;};
  set(1,0,0);
  let k=1;
  if(!fits()){k=search(.55,1,x=>{set(x,0,0);return fits();},10);set(k,0,0);}
  else{k=search(1,1.16,x=>{set(x,0,0);return fits();},9);set(k,0,0);}
  const over=!fits();
  const rp=over?0:search(0,7,x=>{set(k,x,0);return fits();},8);set(k,rp,0);
  const g=over?0:search(0,60,x=>{set(k,rp,x);return fits();},8);set(k,rp,g);
  sh.classList.toggle('ovf',over);
  sh.classList.remove('meas');
 });
}
function fitPages(){

 const w=el.parentElement.clientWidth;let mx=0;el.querySelectorAll('.sheet').forEach(s=>{mx=Math.max(mx,s.offsetWidth)});
 if(mx&&w)el.style.zoom=Math.min(1,(w-6)/mx);
}

function leaveTable(y){

 keys.forEach(k=>(S.months[k].emps||[]).forEach(e=>{
  const id=e.no||e.name;
  const r=byNo[id]||(byNo[id]={id,no:e.no||'',name:e.name,emp:e,m:{}});
  r.name=e.name||r.name;r.emp=e;
  r.m[k]={a:num(e.leave),c:num(e.leaveCas),s:num(e.leaveSick)};
 }));
 const sq=sickQuotaOf();
 const rows=Object.values(byNo).map(r=>{
  const u={a:0,c:0,s:0};Object.values(r.m).forEach(x=>{u.a+=x.a;u.c+=x.c;u.s+=x.s;});
  Object.assign(r,{a:u.a,c:u.c,s:u.s});

 });

}

function newMonth(key,carry){
 const m=normalize({key,reportDate:reportIso(key),updatedAt:now()});
 const ks=monthKeys().filter(k=>k<key),pk=ks[ks.length-1];
 if(carry&&pk){

}

/* إعادة ترحيل الأرصدة: كل شهر بعد شهر الأساس يأخذ «تحت اليد» من متبقي الشهر الذي قبله مباشرة */
function chainDiffs(){
 const ks=monthKeys(),out=[];
 for(let i=1;i<ks.length;i++){
  const m=S.months[ks[i]],pv=ctx(S.months[ks[i-1]]),v=ctx(m);
  const d=CARRY.filter(([t,s])=>Math.abs(v(t)-pv(s))>0.005).map(([t])=>t);
  if(d.length)out.push([ks[i],d]);
 }
 return out;
}
function carryHint(k){const ks=monthKeys(),i=ks.indexOf(k);return (i===0?periodLabel(k)+' أصبح شهر الأساس. ':'')+'راجع «تسلسل الأرصدة» في لوحة المتابعة لإعادة ترحيل الشهور اللاحقة.';}
function rechainAll(){
 const ks=monthKeys();let n=0;
 for(let i=1;i<ks.length;i++){
  const m=S.months[ks[i]],pv=ctx(S.months[ks[i-1]]),v=ctx(m);let ch=false;
  CARRY.forEach(([t,s])=>{if(Math.abs(v(t)-pv(s))>0.005){setP(m,t,pv(s));ch=true;}});
  if(ch){m.updatedAt=now();n++;}
 }
 return n;
}

function sh_(name, head) {

function out_(o) {

}
function normKey_(k) {
  if (k instanceof Date) return Utilities.formatDate(k, Session.getScriptTimeZone(), 'yyyy-MM');
  var s = String(k || '').trim();
  if (/^\d{4}-\d{2}$/.test(s)) return s;
  var d = new Date(s);
  if (!isNaN(d.getTime()) && s.length > 7) return Utilities.formatDate(d, Session.getScriptTimeZone(), 'yyyy-MM');

function doGet(e) {

}
function doPost(e) {
  var b = JSON.parse(e.postData.contents);

    if (b.action === 'delete') {
      if (row > 0) s.deleteRow(row);

/* يستبدل صفوف الشهر (العمود الأول = مفتاح الشهر) بالصفوف الجديدة مع الحفاظ على باقي الشهور مرتبة */
function replace_(name, head, key, rows) {
  var s = head ? sh_(name, head) : ss_().getSheetByName(name);
  if (!s) return;
  s.getRange('A:A').setNumberFormat('@');
  var v = s.getDataRange().getValues(), w = head ? head.length : v[0].length, keep = [];
  for (var i = 1; i < v.length; i++) {
    var rk = normKey_(v[i][0]);
    if (rk !== key && String(v[i][0]) !== key && rk !== '') {
      var rcopy = v[i].slice(0, w);
      rcopy[0] = rk;
      keep.push(rcopy);
    }
  }
  rows.forEach(function (r) { var x = r.slice(0, w); while (x.length < w) x.push(''); keep.push(x); });
  keep.sort(function (a, c) { return String(a[0]) < String(c[0]) ? -1 : String(a[0]) > String(c[0]) ? 1 : 0; });
  if (v.length > 1) s.getRange(2, 1, v.length - 1, Math.max(w, v[0].length)).clearContent();
  if (head) s.getRange(1, 1, 1, w).setValues([head]);
  if (keep.length) s.getRange(2, 1, keep.length, w).setValues(keep);
}`;

 +'<details style="margin-top:10px"><summary>طريقة الإعداد (مرة واحدة)</summary><ol class="st"><li>افتح ملف قاعدة البيانات (الزر أعلاه)، ثم من القائمة: <b>الإضافات ← Apps Script</b>.</li><li>امسح المحتوى والصق الكود أدناه، وغيّر قيمة <b>TOKEN</b> لكلمة سر من اختيارك. (الكود مضبوط مسبقاً على معرّف الملف SHEET_ID).</li><li><b>نشر ← نشر جديد ← تطبيق ويب</b>: التنفيذ بصفتي، ومن لديه حق الوصول: <b>أي شخص</b>. وافق على الأذونات.</li><li>انسخ رابط التطبيق (ينتهي بـ exec) والصقه أعلاه مع كلمة السر.</li></ol><textarea class="code" id="gas" readonly>'+esc(GAS)+'</textarea><div class="btns"><button class="btn" data-act="copygas">نسخ الكود</button></div><p class="mut">أوراق الملف: <b>DB</b> (نسخة كاملة لكل شهر يقرأ منها التطبيق)، <b>ملخص الشهور</b> (صف لكل شهر بكل المؤشرات)، <b>Data</b> (الشهر / القسم / البند / القيمة)، <b>العاملون</b>، <b>صندوق الولاء</b>. لا تعدّل ورقة DB يدوياً؛ التعديل يتم من التطبيق.</p></details>'
 +'<h4>الفتح من أي جهاز (سحابي)</h4><p class="mut">بعد ربط Google Sheets على هذا الجهاز، انسخ «رابط الفتح السريع» وافتحه على أي جهاز آخر: يُربط تلقائياً وتظهر كل البيانات المحفوظة في الشيت. الرابط يحتوي كلمة السر، فاحتفظ به لنفسك فقط.</p><div class="btns"><button class="btn pri" data-act="copycfg">🔗 نسخ رابط الفتح السريع</button><button class="btn" data-act="synctest">🔄 مزامنة الآن</button></div>'
+'<h4>نسخ احتياطي</h4><div class="btns"><button class="btn" data-act="json">⬇️ تنزيل نسخة JSON</button><button class="btn" data-act="restore">⬆️ استيراد ودمج نسخة</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>'
 +'<div class="btns" style="margin-top:16px"><button class="btn pri" data-act="closemodal">تم</button></div>');
}
function openHelp(){
 openModal('<h2>📘 دليل سريع</h2><ol class="st"><li><b>شهر جديد</b>: اختر شهر البيان (مثلاً أكتوبر) ← فعّل «ترحيل الأرصدة» لتنتقل أرصدة آخر شهر مسجل إلى «تحت اليد».</li><li>أدخل البيانات في التبويبات: المتحصلات، الأحكام والمصالحات، نموذج 1، نموذج 2، صندوق الولاء، العاملون. المتبقي والإجماليات تُحسب تلقائياً.</li><li>راجع «لوحة المتابعة»: تنبيهات عدم التطابق مع الشهر السابق والقيم السالبة.</li><li>من «المعاينة والطباعة» اختر التقارير ثم اطبع أو احفظ PDF، أو صدّر Word / Excel.</li><li>المرونة: كل بند في الأحكام يمكن جعله «غير مقدرة القيمة» أو «لا يوجد» أو إخفاؤه، وتقارير صندوق الولاء تعرض «لا توجد» تلقائياً إن لم تُضف صفوفاً.</li><li>التخزين: يُحفظ تلقائياً في المتصفح، ويمكن إضافة ملف مرتبط (OneDrive) و/أو Google Sheets من «الإعدادات».</li></ol><div class="btns"><button class="btn pri" data-act="closemodal">حسناً</button></div>');
}

/* ============ المزامنة ============ */
function idb(mode,fn){return new Promise((res,rej)=>{const r=indexedDB.open('legalMonthlyHandles',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{const tx=r.result.transaction('kv',mode),q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);};r.onerror=()=>rej(r.error);});}
function settingsOut(withLogo){const o=Object.assign({},S.settings);delete o.sheetUrl;delete o.sheetToken;delete o.autoSync;if(!withLogo)delete o.logo;return o;}
function exportObj(){return {app:'legal-monthly',v:1,exportedAt:now(),settings:settingsOut(true),months:S.months,deleted:S.deleted};}
function mergeSettings(d){
 if(!d||(d.updatedAt||'')<=(S.settings.updatedAt||''))return;
 const keep={logo:S.settings.logo,sheetUrl:S.settings.sheetUrl,sheetToken:S.settings.sheetToken,autoSync:S.settings.autoSync};
 S.settings=Object.assign(clone(DEFAULT_SETTINGS),d,keep);if(d.logo)S.settings.logo=d.logo;
}
function mergeMonth(rawK,d){
 const k=normKey((d&&d.key)||rawK);
 if(!k||!/^\d{4}-\d{2}$/.test(k))return 0;
 if(d)d.key=k;
 if(rawK!==k&&!S.pendDel.includes(rawK))S.pendDel.push(rawK);
 if(S.deleted[k]&&S.deleted[k]>(d.updatedAt||''))return 0;
 const l=S.months[k];
 if(!l||(d.updatedAt||'')>(l.updatedAt||'')){S.months[k]=normalize(d);if(rawK===k)S.pushed[k]=d.updatedAt;return 1;}
 return 0;
}
function mergeIn(d){
 let n=0;if(!d)return 0;
 Object.entries(d.deleted||{}).forEach(([k,t])=>{if(t>(S.deleted[k]||'')){S.deleted[k]=t;if(S.months[k]&&S.months[k].updatedAt<t)delete S.months[k];}});
 Object.entries(d.months||{}).forEach(([k,m])=>{n+=mergeMonth(k,m);});
 mergeSettings(d.settings);
 return n;
}
async function writeFile(){const w=await fileHandle.createWritable();await w.write(JSON.stringify(exportObj(),null,1));await w.close();}
async function fileLoad(){
 const f=await fileHandle.getFile(),t=await f.text();
 if(t.trim()){const n=mergeIn(JSON.parse(t));if(n){if(!S.months[S.ui.cur])S.ui.cur=monthKeys().slice(-1)[0]||null;save();}}
 await writeFile();
}
async function fileInit(){
 try{fileHandle=await idb('readonly',s=>s.get('fh'))||null;}catch(e){fileHandle=null;}
 if(!fileHandle)return;
 try{const p=await fileHandle.queryPermission({mode:'readwrite'});if(p==='granted'){await fileLoad();render();}else{needPerm=true;}}catch(e){needPerm=true;}
 updateStatus();
}
async function gs(body){
 const r=await fetch(S.settings.sheetUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:S.settings.sheetToken},body))});
 const j=await r.json();if(!j.ok)throw new Error(j.error==='token'?'كلمة سر Sheets غير صحيحة':'فشل الاتصال بـ Sheets');return j;
}
async function gsPull(){
 const s=S.settings,u=s.sheetUrl+(s.sheetUrl.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(s.sheetToken);
 const r=await fetch(u),j=await r.json();
 if(!j.ok)throw new Error(j.error==='token'?'كلمة سر Sheets غير صحيحة':'فشل الاتصال بـ Sheets');
 let n=0;
 for(const row of j.rows){try{const d=JSON.parse(row.json);if(row.key==='settings')mergeSettings(d);else n+=mergeMonth(row.key,d);}catch(e){}}
 return n;
}
async function gsPush(){
 for(const k of S.pendDel.slice()){await gs({action:'delete',key:k});S.pendDel=S.pendDel.filter(x=>x!==k);}
 for(const k of monthKeys()){
  const m=S.months[k];if(S.pushed[k]===m.updatedAt)continue;
  const json=JSON.stringify(m);if(json.length>49000){toast('تعذر رفع '+periodLabel(k)+': حجم البيانات كبير');continue;}
  await gs({action:'save',key:k,json,tabs:sheetTabs(m)});S.pushed[k]=m.updatedAt;
 }
 if(S.pushed.settings!==S.settings.updatedAt&&S.settings.updatedAt){await gs({action:'save',key:'settings',json:JSON.stringify(settingsOut(false))});S.pushed.settings=S.settings.updatedAt;}
}
async function syncNow(manual){
 if(syncState==='busy')return;
 const useSheets=!!S.settings.sheetUrl&&(manual||S.settings.autoSync),useFile=fileHandle&&!needPerm;
 if(!useSheets&&!useFile){if(manual)toast('لم يتم إعداد أي وجهة مزامنة بعد');return;}
 syncState='busy';updateStatus();
 try{
  let n=0;
  if(useSheets){n=await gsPull();await gsPush();}
  if(useFile){await writeFile();}
  save();syncState='';updateStatus();
  if(manual){toast('تمت المزامنة'+(n?' – تم استلام '+n+' شهر':''));}
  if(n){if(!S.months[S.ui.cur])S.ui.cur=monthKeys().slice(-1)[0]||null;render();}
 }catch(e){syncState='err:'+(e.message||'فشلت المزامنة');updateStatus();if(manual)toast(syncState.slice(4));}
}

/* ============ التصدير ============ */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportJson(){download(new Blob([JSON.stringify(exportObj(),null,1)],{type:'application/json'}),'legal-monthly-backup-'+new Date().toISOString().slice(0,10)+'.json');}
function exportWord(){
 const m=M();if(!m)return;
 const d=pagesDOM(m);
 /* كل مجموعة أوراق متتالية بنفس الاتجاه = قسم مستقل في Word (رأسي أو أفقي) */
 let body='',cur=null;
 [...d.children].forEach(sh=>{const o=sh.classList.contains('land')?'L':'P';
  if(o!==cur){if(cur)body+='</div><br clear="all" style="mso-special-character:line-break;page-break-before:always">';body+='<div class="Sec'+o+'">';cur=o;}
  body+=sh.outerHTML;});
 if(cur)body+='</div>';
 const css=$('#sheetcss').textContent.replace(/@page[^{]*\{[^}]*\}/g,'').replace(/@media print\{[\s\S]*$/,'');
 const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" dir="rtl"><head><meta charset="utf-8"><style>@page SecP{size:21cm 29.7cm;mso-page-orientation:portrait;margin:1cm}@page SecL{size:29.7cm 21cm;mso-page-orientation:landscape;margin:1cm}div.SecP{page:SecP}div.SecL{page:SecL}body{direction:rtl}'+css+'.sheet,.sheet.land{width:auto;min-height:0;box-shadow:none}</style></head><body dir="rtl">'+body+'</body></html>';
 download(new Blob(['\ufeff',html],{type:'application/msword'}),'تقارير-'+m.key+'.doc');
}
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function exportData(){
 const sumH=['الشهر','تاريخ التقرير','إجمالي المتحصلات','قيمة المصالحات','عدد المصالحات','النقض المتبقي','الأحكام المنفذة (قيمة متبقية)','الحجز الإداري المتبقي','عمالية متبقية','مدنية متبقية','جنائي متبقي','تحقيقات متبقية','شكاوى متبقية','فتاوى متبقية','عقود متبقية'];
 const sum=[sumH],flat=[['الشهر','القسم','البند','القيمة']],emp=[['الشهر'].concat(EMPF.filter(c=>c[2]!=='chk').map(c=>c[1]))];
 monthKeys().forEach(k=>{const m=S.months[k],q=kpis(m);sum.push([periodLabel(k),fmtDate(m.reportDate),q.col,q.settle,q.settleN,q.cass,q.exe,q.seiz,q.lab,q.civ,q.crim,q.inv,q.cmp,q.fat,q.con]);flatRows(m).forEach(r=>flat.push([periodLabel(k)].concat(r)));m.emps.forEach(e=>emp.push([periodLabel(k)].concat(EMPF.filter(c=>c[2]!=='chk').map(c=>e[c[0]]==null?'':e[c[0]]))));});
 return {sum,flat,emp};
}
async function exportXlsx(){
 const D=exportData();
 try{if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');}
 catch(e){toast('تعذر تحميل مكتبة Excel (تحتاج اتصالاً بالإنترنت) – تم التصدير بصيغة CSV');const csv=D.flat.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob(['\ufeff'+csv],{type:'text/csv'}),'legal-monthly-data.csv');return;}
 const wb=XLSX.utils.book_new();
 [['ملخص الشهور',D.sum],['كل البيانات',D.flat],['العاملون',D.emp]].forEach(([n,a])=>{const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=a[0].map((_,i)=>({wch:i===2&&n==='كل البيانات'?48:22}));XLSX.utils.book_append_sheet(wb,ws,n);});
 wb.Workbook={Views:[{RTL:true}]};
 XLSX.writeFile(wb,'legal-monthly-'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ============ التشغيل ============ */
/* رابط الإعداد السريع: #cfg=... يضبط رابط Sheets وكلمة السر على هذا الجهاز مرة واحدة */
function readCfgHash(){
 const m=location.hash.match(/^#cfg=(.+)$/);if(!m)return false;
 try{const c=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
  if(c.u){S.settings.sheetUrl=c.u;S.settings.sheetToken=c.t||'';S.settings.autoSync=true;save();}
  history.replaceState(null,'',location.pathname+location.search);return !!c.u;}catch(e){return false;}
}
function cfgLink(){
 const s=S.settings;if(!s.sheetUrl)return '';
 return location.href.split('#')[0]+'#cfg='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({u:s.sheetUrl,t:s.sheetToken})))));
}
let lastSync=0;
const _syncNow=syncNow;
syncNow=async function(manual){await _syncNow(manual);if(syncState===''&&S.settings.sheetUrl)lastSync=Date.now();updateStatus();};
function cloudTick(){if(document.visibilityState==='visible'&&S.settings.sheetUrl&&S.settings.autoSync&&navigator.onLine!==false)syncNow(false);}
document.addEventListener('visibilitychange',cloudTick);
window.addEventListener('online',cloudTick);
window.addEventListener('focus',()=>{if(Date.now()-lastSync>30000)cloudTick();});
setInterval(()=>{if(Date.now()-lastSync>110000)cloudTick();},60000);
load();const cfgOk=readCfgHash();render();fileInit();
if(cfgOk)toast('تم ربط هذا الجهاز بـ Google Sheets');
if(S.settings.sheetUrl&&S.settings.autoSync)syncNow(false);
